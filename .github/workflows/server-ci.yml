name: server-ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # Controles DETECTIVOS de governanca -- classe de risco RC-PROC-01,
  # incidentes 3 (numero citado sem releitura da fonte) e 4 (Control Plane
  # divergindo da evidencia). Ver
  # coretriad/governance/RISK_CLASS-RC-PROC-01_CONTENCAO_POR_DISCIPLINA.md
  #
  # ESTE PASSO E INFORMATIVO, NAO BLOQUEANTE -- E POR QUE:
  #   Os dois verificadores nasceram nesta data e ainda nao tem historico de
  #   taxa de falso positivo em uso real. Torna-los bloqueantes agora
  #   arriscaria travar merges legitimos por ruido de deteccao, e a reacao
  #   previsivel a isso e desabilitar o gate -- perdendo o controle inteiro.
  #
  # ISTO NAO E O ANTIPADRAO DE `AUD-CICD-DEPGATE-01` (gate que sinaliza
  # conformidade sem exerce-la). A distincao, declarada explicitamente:
  #   - o passo EXECUTA os verificadores de verdade, a cada push e PR;
  #   - a saida completa fica no log da execucao;
  #   - `continue-on-error` afeta apenas a COR do check, nunca a execucao;
  #   - o nome do job diz "informativo", entao nenhum leitor pode confundir
  #     verde com conformidade verificada.
  # Promover para bloqueante e decisao humana registrada (Regra 18): basta
  # remover `continue-on-error`. Nenhum agente deve fazer isso sozinho.
  #
  # ===========================================================================
  # !! PARE — CONDICAO VINCULANTE CD-CI-01 (APR-2026-026, item 3) !!
  #
  # NAO remova `continue-on-error: true` sem antes resolver o problema abaixo.
  #
  # `verify-control-plane.cjs` rebaixa FALHA -> AVISO quando um artefato citado
  # so existe em branch de remediacao (`sana/*`), consultando `git log --all`.
  # Isso funciona NA MAQUINA LOCAL, onde essas branches existem como refs.
  # NAO funciona aqui: `actions/checkout` traz o historico completo do ref sob
  # checkout (e o que `fetch-depth: 0` garante), mas NAO traz as demais branches
  # remotas. Num runner limpo, esses artefatos aparecem como CAMINHO_INEXISTENTE
  # -- falha, nao aviso.
  #
  # Consequencia de promover a bloqueante sem corrigir: o CI reprova por
  # artefatos que EXISTEM, a divergencia local-vs-runner vira ruido, e o gate e
  # desligado -- exatamente o antipadrao que AUD-CICD-DEPGATE-01 documenta.
  #
  # Achado da validacao independente do `vericore-sdet-auditor` (2026-08-16),
  # aceito como residuo pelo dono COM esta condicao. Registrado tambem em
  # `coretriad/governance/APPROVALS.md` (APR-2026-026) e em
  # `coretriad/governance/RISK_CLASS-RC-PROC-01_...md` (CE-07).
  # Nenhum agente pode dispensar esta condicao.
  # ===========================================================================
  # ---------------------------------------------------------------------------
  governance-detective-controls:
    name: Controles detectivos de governanca (informativo, nao bloqueante)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 e fetch-tags sao OBRIGATORIOS: com o checkout raso
          # padrao (depth 1), commits e tags legitimamente citados apareceriam
          # como inexistentes -- o verificador viraria uma fabrica de falso
          # positivo. verify-git-references.cjs detecta o clone raso e avisa,
          # mas a correcao certa e ter o historico.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sem `npm ci`: ambos os scripts sao Node puro, sem dependencia externa,
      # pelo mesmo principio de portabilidade do hook do projeto.
      - name: Referencias git citadas existem no repositorio (RC-PROC-01 / incidente 3)
        run: node server/scripts/verify-git-references.cjs || true

      - name: Control Plane reconciliado com o disco (RC-PROC-01 / incidente 4)
        if: always()
        run: node server/scripts/verify-control-plane.cjs || true

  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_evok_audio_ci
          POSTGRES_USER: evok_admin
          POSTGRES_PASSWORD: evok_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evok_admin -d erp_evok_audio_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3101
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: erp_evok_audio_ci
      DB_USER: evok_admin
      DB_PASSWORD: evok_ci_password
      DB_SSL: false
      DB_LOGGING: false
      JWT_SECRET: ci-test-secret-with-at-least-32-characters
      CORS_ORIGIN: http://localhost:5173
      ADMIN_SEED_PASSWORD: EvokCiAdmin123456!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Secret scan
        run: npm run scan:secrets
        working-directory: server

      - name: Typecheck
        run: npm run typecheck
        working-directory: server

      - name: Build
        run: npm run build
        working-directory: server

      - name: Unit tests without skips
        run: npm run test:unit:strict
        working-directory: server

      - name: Integration and edge suites without skips
        run: npm run test:api:strict
        working-directory: server

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
        working-directory: server

      - name: Build immutable Docker image
        run: docker build -t erp-evok-audio-server:${{ github.sha }} ./server

      - name: Prepare schema for smoke container
        run: npm run migration:up
        working-directory: server

      - name: Verify last migration is reversible (down + up)
        # Garante que toda migration nova tem um `down()` que realmente
        # funciona, nao apenas documentalmente -- sem este passo, uma
        # migration com down() quebrado so seria descoberta na hora real
        # de um rollback em producao.
        run: npm run migration:down && npm run migration:up
        working-directory: server

      - name: Run smoke container
        run: |
          docker run -d --name evok-api-smoke \
            --add-host host.docker.internal:host-gateway \
            -e NODE_ENV=test \
            -e PORT=5000 \
            -e DB_HOST=host.docker.internal \
            -e DB_PORT=5432 \
            -e DB_NAME=erp_evok_audio_ci \
            -e DB_USER=evok_admin \
            -e DB_PASSWORD=evok_ci_password \
            -e DB_SSL=false \
            -e DB_LOGGING=false \
            -e JWT_SECRET=ci-test-secret-with-at-least-32-characters \
            -e CORS_ORIGIN=http://localhost:5173 \
            -e ADMIN_SEED_PASSWORD=EvokCiAdmin123456! \
            -p 5000:5000 \
            erp-evok-audio-server:${{ github.sha }}
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:5000/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs evok-api-smoke
          exit 1

      - name: Stop smoke container
        if: always()
        run: docker rm -f evok-api-smoke || true
